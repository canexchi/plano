name: APK

# Roda a cada push no main e tambem no botao "Run workflow" da aba Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # O Capacitor empacota o conteudo de www/. O service worker fica de fora:
      # dentro do app ele so atrapalharia, guardando versoes velhas em cache.
      - name: Monta a pasta web
        run: |
          rm -rf www && mkdir -p www
          cp -r index.html assets icons manifest.webmanifest www/

      - name: Instala o Capacitor
        run: npm install

      - name: Gera o projeto Android
        run: npx cap add android

      # Troca o icone padrao do Capacitor pelo nosso. A pasta anydpi-v26 sai
      # para o Android usar os PNGs em vez do icone adaptativo do template.
      - name: Aplica os icones
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r branding/android/. android/app/src/main/res/

      - name: Compila o APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plano-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
